<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#2c2c2c;color:#fff;padding:20px;}
        h1{text-align:center;margin-bottom:15px;color:#ffd700;}
        .container{max-width:1100px;margin:0 auto;}
        .board{background:#1a4d2e;border-radius:12px;padding:20px;margin-bottom:15px;min-height:240px;}
        .player-info{display:flex;justify-content:space-between;margin-bottom:15px;gap:20px;flex-wrap:wrap;}
        .hp{font-size:22px;color:#ff4444;font-weight:bold;}
        .hero-name{font-size:18px;color:#ffd700;font-weight:bold;}
        .skill-tip{font-size:13px;color:#9fdc9f;margin-top:4px;}
        .equip-area{margin:8px 0;color:#ffc970;font-size:14px;}
        .card-area{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
        .card{
            width:105px;height:150px;background:#fff;color:#222;
            border-radius:8px;padding:8px;cursor:pointer;
            box-shadow:0 3px 8px #0003;transition:transform 0.15s;
        }
        .card:hover{transform:translateY(-6px);}
        .card.selected{box-shadow:0 0 0 4px #ffd700;}
        .card .name{font-weight:bold;font-size:15px;text-align:center;margin-bottom:5px;}
        .card .type{font-size:12px;color:#666;text-align:center;}
        .card .desc{font-size:11px;margin-top:6px;line-height:1.35}
        .btn{padding:9px 18px;background:#c41e3a;color:white;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin:4px;}
        .btn:disabled{background:#666;cursor:not-allowed;}
        .btn.hero-btn{background:#3a6ea5;}
        .btn.hero-btn.selected{background:#ffd700;color:#222;}
        .btn.skill-btn{background:#7b2cbf;display:none;}
        .log{margin-top:12px;background:#111;padding:12px;border-radius:8px;height:150px;overflow-y:auto;font-size:14px;color:#ccc;}
        .select-area{background:#333;border-radius:10px;padding:15px;margin-bottom:15px;}
        .target-tip{color:#ffd700;font-size:16px;margin:10px 0;}
    </style>
</head>
<body>
<div class="container">
    <h1>三国杀 · 完整版</h1>

    <div class="select-area">
        <h3 style="margin-bottom:10px;">第一步：拣选你嘅武将</h3>
        <div id="heroSelect" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>

    <div class="board">
        <div class="player-info">
            <div>
                <div class="hero-name" id="myHeroName">未选武将</div>
                <div>血量：<span class="hp" id="myHp">4</span></div>
                <div class="skill-tip" id="mySkill"></div>
                <div class="equip-area">装备：<span id="myEquip">无</span></div>
                <button class="btn skill-btn" id="rendBtn" onclick="useRende()">仁德</button>
            </div>
            <div>
                <div style="text-align:right;">
                    <div class="hero-name" id="enemyHeroName">敌方未选</div>
                    <div>血量：<span class="hp" id="enemyHp">4</span></div>
                    <div class="skill-tip" id="enemySkill"></div>
                    <div class="equip-area">装备：<span id="enemyEquip">无</span></div>
                </div>
            </div>
        </div>
        <div class="target-tip" id="targetTip"></div>
        <div>你的手牌：</div>
        <div class="card-area" id="handCards"></div>
    </div>

    <button class="btn" id="startTurnBtn" onclick="startMyTurn()">开始你的回合</button>
    <button class="btn" id="endTurnBtn" onclick="endMyTurn()" disabled>结束回合</button>
    <button class="btn" onclick="restartGame()">重新开始</button>

    <div class="log" id="gameLog">
        游戏开始！请先拣选一个武将。<br>
        规则：回合分摸牌→出牌→弃牌；出【杀】需要拣目标，对方出【闪】抵消；手牌上限=当前血量。
    </div>
</div>

<script>
// ===== 武将库 =====
const heroList = [
    {name:"刘备", hp:4, skill:"仁德：出牌阶段，可以拣手牌送给敌方，每送出2张牌，自己摸1张牌"},
    {name:"关羽", hp:4, skill:"武圣：出牌阶段，可以将【闪】当做【杀】打出"},
    {name:"张飞", hp:4, skill:"咆哮：出牌阶段可出无限张【杀】"},
    {name:"郭嘉", hp:3, skill:"遗计：受到伤害时，立即摸两张牌"},
    {name:"赵云", hp:4, skill:"龙胆：【杀】同【闪】可以互相转换使用"},
    {name:"诸葛亮", hp:3, skill:"观星：回合开始摸3张牌，代替2张"}
];

// ===== 卡牌库 =====
const cardList = [
    {name:"杀", type:"基本牌", desc:"拣目标使用，对方不出闪则扣1血"},
    {name:"闪", type:"基本牌", desc:"抵消【杀】，不可主动打出（赵云/关羽可转换）"},
    {name:"桃", type:"基本牌", desc:"回复1点血量（唔超上限）"},
    {name:"过河拆桥", type:"锦囊", desc:"拣目标，可以拆对方手牌或者装备"},
    {name:"无中生有", type:"锦囊", desc:"立即摸2张牌"},
    {name:"南蛮入侵", type:"锦囊", desc:"敌方必须打出【杀】，否则扣1点伤害"},
    {name:"决斗", type:"锦囊", desc:"双方轮流出杀，冇杀嘅一方扣1血"},
    {name:"青釭剑", type:"武器", desc:"武器：攻击时无视防具效果"},
    {name:"八卦阵", type:"防具", desc:"防具：受到杀攻击，50%自动出闪"}
];

// ===== 游戏状态 =====
let myHero = null;
let enemyHero = null;
let myHp = 4, enemyHp = 4;
let myHand = [], enemyHand = [];
let myWeapon = null, myArmor = null;
let enemyWeapon = null, enemyArmor = null;
let isMyTurn = false;
let killUsedThisTurn = 0;
let waitingTarget = null;
let gameOver = false;
let selectedHandIndex = -1; // 选中手牌，用于仁德送牌
let rendeGiveCount = 0; // 仁德本回合送出牌数量

const logDom = document.getElementById("gameLog");
const handDom = document.getElementById("handCards");
const startBtn = document.getElementById("startTurnBtn");
const endBtn = document.getElementById("endTurnBtn");
const rendBtn = document.getElementById("rendBtn");
const targetTip = document.getElementById("targetTip");
const myEquipDom = document.getElementById("myEquip");
const enemyEquipDom = document.getElementById("enemyEquip");

function addLog(t){
    logDom.innerHTML += "<p>" + t + "</p>";
    logDom.scrollTop = logDom.scrollHeight;
}
function randomCard(){
    return {...cardList[Math.floor(Math.random()*cardList.length)]};
}
function draw(arr, n){
    for(let i=0;i<n;i++) arr.push(randomCard());
}
function hasKillLimit(){
    return myHero && myHero.name !== "张飞";
}

// ===== 武将选择 =====
function renderHeroSelect(){
    const box = document.getElementById("heroSelect");
    box.innerHTML = "";
    heroList.forEach((h, i)=>{
        const b = document.createElement("button");
        b.className = "btn hero-btn";
        b.innerText = `${h.name}（${h.hp}血）`;
        b.title = h.skill;
        b.onclick = ()=>selectHero(i);
        box.appendChild(b);
    });
}
function selectHero(idx){
    myHero = heroList[idx];
    myHp = myHero.hp;
    gameOver = false;
    rendeGiveCount = 0;
    selectedHandIndex = -1;
    document.getElementById("myHeroName").innerText = "你：" + myHero.name;
    document.getElementById("myHp").innerText = myHp;
    document.getElementById("mySkill").innerText = "技能：" + myHero.skill;
    addLog(`你拣选咗【${myHero.name}】`);

    const eIdx = Math.floor(Math.random()*heroList.length);
    enemyHero = heroList[eIdx];
    enemyHp = enemyHero.hp;
    document.getElementById("enemyHeroName").innerText = "敌方：" + enemyHero.name;
    document.getElementById("enemyHp").innerText = enemyHp;
    document.getElementById("enemySkill").innerText = "技能：" + enemyHero.skill;
    addLog(`敌方武将系【${enemyHero.name}】`);

    myWeapon = null; myArmor = null;
    enemyWeapon = null; enemyArmor = null;
    refreshEquipUI();

    // 只有刘备先显示仁德按钮
    if(myHero.name === "刘备"){
        rendBtn.style.display = "inline-block";
    }else{
        rendBtn.style.display = "none";
    }

    draw(myHand, 4);
    draw(enemyHand, 4);
    renderHand();
}
function refreshEquipUI(){
    myEquipDom.innerText = (myWeapon||"无武器") + " | " + (myArmor||"无防具");
    enemyEquipDom.innerText = (enemyWeapon||"无武器") + " | " + (enemyArmor||"无防具");
}

// ===== 渲染手牌 =====
function renderHand(){
    handDom.innerHTML = "";
    myHand.forEach((c, idx)=>{
        const d = document.createElement("div");
        d.className = "card";
        if(idx === selectedHandIndex) d.classList.add("selected");
        d.innerHTML = `<div class="name">${c.name}</div>
                       <div class="type">${c.type}</div>
                       <div class="desc">${c.desc}</div>`;
        if(isMyTurn && !gameOver){
            d.onclick = ()=>{
                // 如果而家准备用仁德，就只做选中手牌
                if(selectedHandIndex === -1 && waitingTarget === "rende"){
                    selectedHandIndex = idx;
                    renderHand();
                    targetTip.innerText = "👉 拣好牌啦！点敌方区域送牌";
                }else{
                    playCard(idx);
                }
            };
        }
        handDom.appendChild(d);
    });
}

// ===== 刘备仁德技能 =====
function useRende(){
    if(gameOver) return;
    if(!isMyTurn || myHero.name !== "刘备") return;
    if(myHand.length === 0){
        addLog("冇手牌可以送出！");
        return;
    }
    waitingTarget = "rende";
    selectedHandIndex = -1;
    targetTip.innerText = "👉 拣一张手牌，再点敌方送出（仁德）";
}
// 仁德送牌俾敌方
function rendeGiveCard(){
    if(selectedHandIndex < 0) return;
    const card = myHand.splice(selectedHandIndex,1)[0];
    enemyHand.push(card);
    rendeGiveCount += 1;
    addLog(`仁德：你送出【${card.name}】俾敌方！`);
    // 每送出2张，摸1张
    if(rendeGiveCount % 2 === 0){
        draw(myHand,1);
        addLog(`仁德累积送出${rendeGiveCount}张，摸一张牌！`);
    }
    selectedHandIndex = -1;
    waitingTarget = null;
    targetTip.innerText = "";
    renderHand();
    checkOver();
}

// ===== 出牌逻辑 =====
function playCard(idx){
    if(gameOver) return;
    if(!isMyTurn) return;
    // 如果系仁德模式，唔进入出牌
    if(waitingTarget === "rende"){
        selectedHandIndex = idx;
        renderHand();
        targetTip.innerText = "👉 拣好牌啦！点敌方区域送出";
        return;
    }

    const c = myHand[idx];
    let useAsKill = false;
    let useAsShan = false;

    // 赵云龙胆 / 关羽武圣
    if(myHero.name === "赵云"){
        if(c.name === "杀") useAsShan = true;
        if(c.name === "闪") useAsKill = true;
    }
    if(myHero.name === "关羽" && c.name === "闪"){
        useAsKill = true;
    }

    if(c.name === "闪" && !useAsKill){
        addLog("【闪】唔可以主动打出！");
        return;
    }

    if((c.name === "杀" || useAsKill) && hasKillLimit() && killUsedThisTurn >= 1){
        addLog("你本回合已经出过【杀】（张飞咆哮先可以无限出）！");
        return;
    }

    // 装备牌
    if(c.type === "武器"){
        myWeapon = c.name;
        myHand.splice(idx,1);
        addLog(`装备【${c.name}】！`);
        refreshEquipUI();
        renderHand();
        return;
    }
    if(c.type === "防具"){
        myArmor = c.name;
        myHand.splice(idx,1);
        addLog(`装备【${c.name}】！`);
        refreshEquipUI();
        renderHand();
        return;
    }

    // 需要目标
    if(c.name === "杀" || useAsKill){
        waitingTarget = {type:"kill", index:idx, useAsKill};
        targetTip.innerText = "👉 拣目标：敌方（杀）";
        return;
    }
    if(c.name === "过河拆桥"){
        waitingTarget = {type:"qiao", index:idx};
        targetTip.innerText = "👉 拣目标：敌方（过河拆桥）";
        return;
    }
    if(c.name === "决斗"){
        waitingTarget = {type:"jue", index:idx};
        targetTip.innerText = `👉 拣目标：敌方（决斗）`;
        return;
    }

    // 唔使目标锦囊
    addLog(`你打出【${c.name}】`);
    if(c.name === "桃"){
        if(myHp < myHero.hp){
            myHp++;
            document.getElementById("myHp").innerText = myHp;
            addLog("你食桃，回血1点！");
        }else{
            addLog("血量已满，食唔到桃！");
            return;
        }
    }else if(c.name === "无中生有"){
        draw(myHand, 2);
        addLog("无中生有，摸2张牌！");
    }else if(c.name === "南蛮入侵"){
        let enemyHasKill = enemyHand.some(x=>x.name==="杀");
        if(enemyHasKill){
            const kidx = enemyHand.findIndex(x=>x.name==="杀");
            enemyHand.splice(kidx,1);
            addLog("敌方打出【杀】抵御南蛮！");
        }else{
            damageEnemy(1);
        }
    }
    myHand.splice(idx,1);
    renderHand();
    checkOver();
}

// 选择敌方目标
function selectEnemyTarget(){
    if(gameOver) return;
    if(!waitingTarget) return;

    // 仁德送牌
    if(waitingTarget === "rende"){
        rendeGiveCard();
        return;
    }

    const w = waitingTarget;
    const c = myHand[w.index];
    if(!c) return;

    if(w.type === "kill"){
        killUsedThisTurn++;
        addLog(`你打出【${c.name}】攻击敌方！`);
        let armorBlock = false;
        if(enemyArmor === "八卦阵" && enemyWeapon !== "青釭剑"){
            const luck = Math.random() > 0.5;
            if(luck){
                addLog("敌方八卦阵生效，自动出闪！");
                armorBlock = true;
            }
        }
        if(!armorBlock){
            let shanIdx = enemyHand.findIndex(x=>x.name==="闪");
            if(shanIdx !== -1){
                addLog("敌方打出【闪】抵消！");
                enemyHand.splice(shanIdx,1);
            }else{
                damageEnemy(1);
            }
        }
    }else if(w.type === "qiao"){
        addLog(`你打出【过河拆桥】，目标敌方！`);
        let opt = prompt("拆敌方【手牌】输入 1，拆【装备】输入 2");
        if(opt === "1"){
            if(enemyHand.length>0){
                enemyHand.pop();
                addLog("拆掉敌方一张手牌！");
            }else addLog("敌方冇手牌！");
        }else if(opt === "2"){
            if(enemyWeapon){
                addLog(`拆掉武器【${enemyWeapon}】`);
                enemyWeapon = null;
            }else if(enemyArmor){
                addLog(`拆掉防具【${enemyArmor}】`);
                enemyArmor = null;
            }else addLog("敌方冇装备可以拆！");
            refreshEquipUI();
        }else{
            addLog("取消过河拆桥");
            waitingTarget = null;
            targetTip.innerText = "";
            return;
        }
    }else if(w.type === "jue"){
        addLog(`【决斗】！双方轮流出杀！`);
        let duelEnd = false;
        while(!duelEnd){
            let ek = enemyHand.findIndex(x=>x.name==="杀");
            if(ek === -1){
                addLog("敌方冇杀，受到1点伤害！");
                damageEnemy(1);
                duelEnd = true;
            }else{
                enemyHand.splice(ek,1);
                addLog("敌方出杀！轮到你");
                let mk = myHand.findIndex(x=>x.name==="杀");
                if(mk === -1){
                    addLog("你冇杀，受到1点伤害！");
                    damageMe(1);
                    duelEnd = true;
                }else{
                    myHand.splice(mk,1);
                    addLog("你出杀！继续决斗");
                }
            }
        }
    }
    myHand.splice(w.index,1);
    waitingTarget = null;
    targetTip.innerText = "";
    renderHand();
    checkOver();
}

// 扣血函数
function damageEnemy(n){
    enemyHp -= n;
    document.getElementById("enemyHp").innerText = enemyHp;
    addLog(`敌方受到 ${n} 点伤害！`);
    if(enemyHero && enemyHero.name === "郭嘉"){
        draw(enemyHand, 2);
        addLog("✨ 敌方郭嘉【遗计】触发，摸2张牌！");
    }
}
function damageMe(n){
    myHp -= n;
    document.getElementById("myHp").innerText = myHp;
    addLog(`你受到 ${n} 点伤害！`);
    if(myHero && myHero.name === "郭嘉"){
        draw(myHand, 2);
        addLog("✨ 你的【遗计】触发，摸2张牌！");
        renderHand();
    }
}

function endMyTurn(){
    if(gameOver) return;
    if(!isMyTurn) return;
    addLog("【弃牌阶段】手牌上限 = 当前血量 " + myHp);
    while(myHand.length > myHp){
        myHand.pop();
        addLog("手牌过多，自动弃一张");
    }
    renderHand();
    isMyTurn = false;
    rendBtn.disabled = true;
    startBtn.disabled = false;
    endBtn.disabled = true;
    rendeGiveCount = 0; // 仁德计数重置
    addLog("你的回合结束，敌方行动中…");
    setTimeout(enemyTurn, 800);
}

// ===== 敌方AI =====
function enemyTurn(){
    if(gameOver) return;
    addLog("===== 敌方回合开始 =====");
    const drawNum = enemyHero?.name === "诸葛亮" ? 3 : 2;
    draw(enemyHand, drawNum);

    // 敌方装备
    const equipIdx = enemyHand.findIndex(x=>x.type==="武器"||x.type==="防具");
    if(equipIdx !== -1){
        const ec = enemyHand[equipIdx];
        if(ec.type === "武器") enemyWeapon = ec.name;
        if(ec.type === "防具") enemyArmor = ec.name;
        enemyHand.splice(equipIdx,1);
        addLog(`敌方装备【${ec.name}】`);
        refreshEquipUI();
    }

    // 敌方出杀
    let killIdx = enemyHand.findIndex(x=>x.name==="杀");
    if(killIdx !== -1){
        addLog("敌方对你出【杀】！");
        enemyHand.splice(killIdx,1);
        let armorBlock = false;
        if(myArmor === "八卦阵" && enemyWeapon !== "青釭剑"){
            const luck = Math.random() > 0.5;
            if(luck){
                addLog("你的八卦阵生效，自动出闪！");
                armorBlock = true;
            }
        }
        if(!armorBlock){
            let myShan = myHand.findIndex(x=>x.name==="闪");
            if(myShan !== -1){
                addLog("你自动打出【闪】抵消！");
                myHand.splice(myShan,1);
                renderHand();
            }else{
                damageMe(1);
            }
        }
    }

    // 敌方过河拆桥
    let qiaoIdx = enemyHand.findIndex(x=>x.name==="过河拆桥");
    if(qiaoIdx !== -1 && (myHand.length>0 || myWeapon || myArmor)){
        addLog("敌方使用过河拆桥！");
        enemyHand.splice(qiaoIdx,1);
        if(myHand.length>0){
            myHand.pop();
            addLog("你被拆掉一张手牌！");
        }else if(myWeapon){
            addLog(`敌方拆掉你武器${myWeapon}`);
            myWeapon = null;
        }else if(myArmor){
            addLog(`敌方拆掉你防具${myArmor}`);
            myArmor = null;
        }
        refreshEquipUI();
        renderHand();
    }

    // 敌方南蛮
    let nanIdx = enemyHand.findIndex(x=>x.name==="南蛮入侵");
    if(nanIdx !== -1){
        addLog("敌方打出南蛮入侵！");
        enemyHand.splice(nanIdx,1);
        let myKill = myHand.some(x=>x.name==="杀");
        if(myKill){
            const mk = myHand.findIndex(x=>x.name==="杀");
            myHand.splice(mk,1);
            addLog("你打出杀抵御南蛮");
            renderHand();
        }else{
            damageMe(1);
        }
    }

    // 敌方残血食桃
    if(enemyHp <= 2){
        let peach = enemyHand.findIndex(x=>x.name==="桃");
        if(peach !== -1 && enemyHp < enemyHero.hp){
            enemyHand.splice(peach,1);
            enemyHp++;
            document.getElementById("enemyHp").innerText = enemyHp;
            addLog("敌方食桃回血！");
        }
    }

    // 敌方弃牌
    while(enemyHand.length > enemyHp) enemyHand.pop();
    addLog("敌方回合结束，轮到你。");
    checkOver();
}

function checkOver(){
    if(enemyHp <= 0){
        gameOver = true;
        addLog("🎉 敌方阵亡，你胜利！游戏结束！");
        startBtn.disabled = true; endBtn.disabled = true; rendBtn.disabled=true;
    }else if(myHp <= 0){
        gameOver = true;
        addLog("💀 你阵亡，游戏失败！游戏结束！");
        startBtn.disabled = true; endBtn.disabled = true; rendBtn.disabled=true;
    }
}

function startMyTurn(){
    if(gameOver) return;
    if(!myHero){ addLog("请先拣选武将！"); return; }
    if(isMyTurn) return;
    isMyTurn = true;
    killUsedThisTurn = 0;
    rendeGiveCount = 0;
    startBtn.disabled = true;
    endBtn.disabled = false;
    if(myHero.name === "刘备") rendBtn.disabled = false;
    const drawNum = myHero.name === "诸葛亮" ? 3 : 2;
    addLog(`===== 你的回合开始（摸牌阶段，摸${drawNum}张）=====`);
    draw(myHand, drawNum);
    renderHand();
}

function restartGame(){
    location.reload();
}
// 点击敌方区域触发目标选择
document.querySelector(".player-info > div:nth-child(2)").addEventListener("click", ()=>{
    if(waitingTarget && !gameOver){
        selectEnemyTarget();
    }
});

renderHeroSelect();
</script>
</body>
</html>
